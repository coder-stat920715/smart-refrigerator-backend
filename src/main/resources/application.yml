server:
  port: 8080

spring:
  application:
    name: smart-refrigerator-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartfridge}
    username: ${SPRING_DATASOURCE_USERNAME:smartfridge}
    password: ${SPRING_DATASOURCE_PASSWORD:smartfridge}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 66MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.smartfridge: INFO

app:
  mqtt:
    enabled: true
    broker-url: ${APP_MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${APP_MQTT_USERNAME:}
    password: ${APP_MQTT_PASSWORD:}
    client-id-prefix: smart-fridge-backend
    qos: 1
    clean-session: true
    keep-alive-seconds: 30
    connection-timeout-seconds: 10
    completion-timeout-ms: 5000
    shared-subscription-group: ""
  alerts:
    fridge-temp-threshold: 10.0
    fridge-breach-minutes: 15
    freezer-temp-threshold: -10.0
    freezer-breach-minutes: 15
    door-open-minutes: 5
    compressor-continuous-hours: 6
    compressor-min-temp-drop: 1.0
  telemetry:
    min-temp: -60.0
    max-temp: 60.0
    spike-window-seconds: 30
    max-spike-celsius: 15.0
    retention-days: 30
  firmware:
    storage-dir: ${APP_FIRMWARE_STORAGE_DIR:./firmware-store}
    public-base-url: ${APP_FIRMWARE_PUBLIC_BASE_URL:http://localhost:8080}
    signing-secret: ${APP_FIRMWARE_SIGNING_SECRET:change-me-in-production}
  maintenance:
    heartbeat-timeout-seconds: 90
    ota-job-timeout-minutes: 60
    check-interval-ms: 30000
    initial-delay-ms: 30000
    retention-cron: "0 30 3 * * *"
